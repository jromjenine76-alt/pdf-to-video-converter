name: Spellcraft Key Check

on:
  push:
    branches:
      - spellcraft-voice-bridge
    paths:
      - '.github/workflows/spellcraft-key-check.yml'

jobs:
  check-key:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check OpenAI key availability
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY_PRESENT=true"
          else
            echo "OPENAI_API_KEY_PRESENT=false"
            exit 2
          fi
