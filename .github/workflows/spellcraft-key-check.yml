name: Spellcraft Key Check

on:
  push:
    branches:
      - spellcraft-voice-bridge

jobs:
  check-key:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check OpenAI key availability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is configured for this repository."
          else
            echo "::warning::OPENAI_API_KEY is not configured for this repository."
          fi
