name: Spellcraft Key Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/spellcraft-key-check.yml'

jobs:
  check-key:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check OpenAI key availability
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY_PRESENT=true"
          else
            echo "::warning::OPENAI_API_KEY is not configured for this repository."
            echo "OPENAI_API_KEY_PRESENT=false"
          fi
