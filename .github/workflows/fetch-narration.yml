name: Fetch temporary narration

on:
  push:
    paths:
      - '.github/workflows/fetch-narration.yml'
  workflow_dispatch:

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch saved voiceover data
        run: |
          set -euxo pipefail
          JSON='https://www.aidocmaker.com/_next/data/build-TfctsWXpff2fKS/g0/audio.json?appCode=g0&name=12e74329d7a845af84b2dabd5dd115cc&search=true'
          curl -L --fail "$JSON" -o data.json
          python - <<'PY'
          import json,re,requests
          raw=open('data.json','r',errors='ignore').read()
          print(raw[:8000])
          urls=re.findall(r'https?://[^"\\ ]+',raw)
          print('\nURLS:')
          for u in urls: print(u)
          ok=False
          for u in reversed(urls):
              if any(x in u.lower() for x in ['.mp3','.wav','.m4a','.aac','storage.googleapis','cloudfront','audio']):
                  try:
                      r=requests.get(u,timeout=60,allow_redirects=True)
                      ct=r.headers.get('content-type','').lower()
                      print('TRY',u,r.status_code,len(r.content),ct)
                      if r.ok and len(r.content)>50000 and ('audio' in ct or u.lower().split('?')[0].endswith(('.mp3','.wav','.m4a','.aac'))):
                          open('narration.mp3','wb').write(r.content)
                          ok=True
                          break
                  except Exception as e:
                      print('ERR',e)
          if not ok:
              raise SystemExit('No audio URL in saved data')
          PY
          file narration.mp3
          ls -lh narration.mp3
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: narration-audio-json
          path: narration.mp3
          retention-days: 1
