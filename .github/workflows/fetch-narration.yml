name: Build extended full-kit narration

on:
  push:
    paths:
      - '.github/workflows/fetch-narration.yml'
  workflow_dispatch:

jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - name: Generate extended natural narration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q edge-tts
          cat > /tmp/make_voice.py <<'PY'
          import asyncio, edge_tts

          parts = [
          """This walkthrough begins the moment you open the Manifest Your Dreams Seal Kit. Place the box on a clear, stable, heat-safe surface and give yourself enough room to lay everything out. Before lighting anything, separate the contents so you can see the full system at once: the teal storage box, the step-by-step manual, the green-and-gold fountain pen, the black ink cartridge, cream writing sheets, the lighter fire-paper sheets, three colored envelopes, two bottles of wax beads, the wax spoon and warmer, two tea candles, the decorative stamp handle, two interchangeable brass seal heads, and the antique-style key shown with the set. The point of this first step is simple: nothing should be hidden under paper or inside the box once the ritual begins. You want the writing tools, wax tools, and fire tools easy to reach without crossing your hands over an open flame.""",
          """Now take a slower look at what each item is for. The storage box keeps the set together between uses. The manual is not just packaging; the product listing describes it as the guide for manifestation theory, intention-setting, the symbolism of elements and colors, pairing wax color with a goal, and the sequence for different kinds of manifestation work. The cream writing paper is for intentions you want to preserve or place inside an envelope. The fire paper is the separate paper used for the release step. The envelopes are the physical container for the intention you keep. The two wax-bead bottles provide the sealing wax, and the tea candles provide the small working flame for the warmer. The green warmer supports the spoon while the wax melts. The ornate handle accepts the interchangeable seal heads. The product photographs also show an antique-style key. The PDFs do not assign that key a mechanical step, so treat it as a decorative or symbolic accessory unless your printed manual gives it a more specific role.""",
          """The product listing also mentions jars or intention-setting jars. In the photographs you supplied, the small corked bottles beside the warmer are the visible containers associated with the wax beads, while the short three-page listing does not give a separate procedure for an additional jar ritual. So do not invent an extra step. If your physical box contains extra jars beyond the wax-bead bottles, use the printed manual for those. This is important because a full walkthrough should distinguish between what the kit clearly demonstrates and what is only mentioned in the listing. The same rule applies to wax colors. The listing says the manual explains color symbolism and how to pair a wax color with a goal, but the three-page product listing does not reproduce that color chart. Choose your wax color from the manual rather than relying on a made-up universal chart.""",
          """Next, prepare the fountain pen. Remove the cap and hold the metallic gold grip section behind the nib. Unscrew the long green barrel counter-clockwise. Your close-up photos reveal a detail that was easy to miss in the product pictures: a clear converter with a red end is already attached to the back of the grip section. Because the kit also includes a disposable black ink cartridge, the converter and the cartridge are two different ink systems. To use the disposable cartridge, pull the clear converter straight out from the back of the grip. Do not twist the nib section and do not force the converter sideways. Set the converter aside somewhere clean so it does not get lost. Now inspect the black cartridge. One end is the broad back end. The other end has the narrow clear neck and sealed opening. That narrow clear end is the end that goes into the pen first.""",
          """Line the narrow end of the cartridge directly with the opening in the back of the gold grip section. Keep the cartridge straight and push with firm, even pressure. The internal post inside the pen has to puncture the cartridge seal so the ink can enter the feed. You may feel or hear a small click when it seats. Do not twist the cartridge while pushing, and do not bend it, because that can crack the plastic or leave the seal only partly opened. Once the cartridge is seated, slide the green barrel back over it and screw the barrel clockwise until it is snug. Do not overtighten it. Then hold the pen with the nib pointing downward for thirty to sixty seconds. A brand-new dry feed needs time to saturate. Test the pen on ordinary scratch paper, not your ritual sheet. Make several light loops until the line becomes continuous and stops skipping. Only then move to the actual intention paper.""",
          """Now decide which paper you are using and why. The cream ritual paper is the paper to use when the written intention will be kept, folded, or placed in one of the envelopes. The fire paper is for the intention you plan to release by burning. The separate burn-paper information you supplied recommends writing hopes, dreams, affirmations, or intentions in the present tense and visualizing them while you write. The important practical point is clarity. Use a short statement you can understand later. Write what you are choosing, welcoming, building, releasing, or committing to. Keep the wording focused enough that when you look at it again, you know exactly what the statement meant. The kit turns an internal intention into a physical sequence: first it exists as thought, then as ink on paper, then as a sealed or released action.""",
          """Before melting any wax, choose the seal head. Your kit shows two interchangeable brass designs. The product material identifies the Seal of Solomon with power and action, and elsewhere summarizes it with the phrase, I get what I want. The Sigil of Truth is associated with truth, clarity, and alignment, and the product material summarizes it as Be True. Choose the design according to the character of the intention, not just which stamp looks prettier. If the intention is about decisive movement, commitment, or action, the Solomon seal is the stronger thematic match in the supplied materials. If the intention is about honesty, seeing clearly, alignment, or staying true to a path, use the Truth sigil. Screw or fit the selected brass head securely onto the ornate handle before the wax is hot. Keep the unused head away from the candle so you are not handling loose metal near the flame.""",
          """Set up the wax station next. Put the green warmer on the heat-safe surface and place one tea candle beneath it. The second tea candle is your spare or can be used later, but there is no need to crowd the work area with multiple flames. Put a small amount of wax beads into the brass spoon. Use the color guidance from the manual if you are choosing wax by intention. Rest the spoon over the warmer and allow the beads to soften and merge into one smooth pool. Do not fill the spoon to the brim. Hot wax is easier to control when you melt only what you need for one seal. Keep hair, loose sleeves, paper edges, and the ink cartridge away from the candle. The warmer and spoon are tools for controlled heat, not for creating a large flame. When the wax is fully liquid, lift the spoon by its handle and move directly to the envelope or paper you are sealing.""",
          """Pour a small pool of melted wax onto the place where the envelope flap meets the body of the envelope. Aim for a round pool just a little larger than the brass seal head. While the wax is still soft, bring the selected stamp straight down into the center. Press firmly enough to make the design, but do not rock the handle from side to side because that can smear the impression. Hold the stamp still for several seconds while the wax begins to cool. Then lift straight up. If the stamp resists, give it another moment rather than twisting it loose. Let the finished seal cool before picking up the envelope. This is the physical commitment step emphasized in the product description: the melting, pouring, and sealing create a visible boundary around the intention. Once the wax is set, the envelope becomes the object you keep and return to later.""",
          """The fire paper is a different ending. Use it only for the written statement you intend to release. Move to a fire-safe area before lighting it. Keep the other ritual papers, envelopes, wax bottles, and your sleeves away from the flame. Hold the fire paper at an edge, ignite it carefully, and let the flame move away from your hand over a safe surface. The burn-paper information you supplied says the paper behaves differently from ordinary paper and can burn more aggressively when tightly compacted. For safety, do not crumple or compress it to create a burst of flame. Keep it open and controlled. The symbolic action described in the kit is release: the written wish or statement is no longer being stored as a physical note. Once the paper is extinguished and the area is safe, allow the fire step to be finished before returning to the wax or envelope.""",
          """At this point, separate the two endings in your mind. The fire-paper statement is the one you release. The sealed envelope is the one you keep. Place the preserved intention inside one of the colored envelopes, close the flap, and seal it with the wax impression you already chose. The four-step graphic supplied with the kit describes that envelope as a physical promise you can return to at any time. Put it somewhere deliberate rather than tossing it into a drawer with unrelated papers. You can date the outside if you want a record of when the intention was made, but the kit does not require a specific storage interval. The important thing is consistency: do not burn the paper you meant to preserve, and do not treat the fire-paper release like another envelope note. They represent two different physical actions within the same manifestation framework.""",
          """Finally, clean and reset the kit so every item is ready for the next use. Extinguish the tea candle completely. Let the spoon, warmer, stamp head, and any spilled wax cool before touching or cleaning them. Cap the fountain pen so the nib is protected. If the disposable cartridge remains installed, leave it seated rather than repeatedly removing and reinserting it. Return the spare seal head, converter, antique-style key, wax bottles, candle, envelopes, remaining writing paper, and fire paper to the box. Keep the manual with the kit because it contains the color and symbolism guidance not reproduced in the short product listing. The complete sequence is now clear: open and inventory the box; prepare and prime the pen; choose the correct paper; write the intention; select the seal; choose wax color from the manual; melt and pour the wax; stamp the envelope; perform the fire-paper release only when that is the chosen path; preserve the sealed intention; then safely reset the tools. That is the full kit working as one system from opening the box to putting it away again."""
          ]

          async def main():
              for i, text in enumerate(parts, 1):
                  c = edge_tts.Communicate(text, voice='en-US-JennyNeural', rate='-8%', volume='+0%', pitch='+0Hz')
                  await c.save(f'part_{i:02}.mp3')
          asyncio.run(main())
          PY
          python /tmp/make_voice.py
          ffmpeg -y -f lavfi -i anullsrc=r=24000:cl=mono -t 1.15 -c:a libmp3lame -b:a 64k silence.mp3 >/dev/null 2>&1
          rm -f concat.txt
          for f in part_*.mp3; do
            echo "file '$PWD/$f'" >> concat.txt
            echo "file '$PWD/silence.mp3'" >> concat.txt
          done
          ffmpeg -y -f concat -safe 0 -i concat.txt -c:a libmp3lame -b:a 96k -ar 24000 -ac 1 extended_full_kit_narration.mp3
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 extended_full_kit_narration.mp3
          ls -lh extended_full_kit_narration.mp3
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: extended-full-kit-narration
          path: extended_full_kit_narration.mp3
          retention-days: 1
