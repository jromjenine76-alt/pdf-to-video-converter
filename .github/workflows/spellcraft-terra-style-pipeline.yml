name: Spellcraft Chapterized Preview Pipeline

on:
  workflow_dispatch:
    inputs:
      chapter_start:
        description: First chapter adapter ID to render
        required: false
        default: '1'
      chapter_end:
        description: Last chapter adapter ID to render
        required: false
        default: '8'
  push:
    branches:
      - spellcraft-terra-style-pipeline-v1
    paths:
      - 'production_trigger/chapter1.txt'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  select-chapters:
    runs-on: ubuntu-latest
    outputs:
      chapters: ${{ steps.matrix.outputs.chapters }}
    steps:
      - name: Resolve requested chapters
        id: matrix
        env:
          CHAPTER_START: ${{ inputs.chapter_start }}
          CHAPTER_END: ${{ inputs.chapter_end }}
        run: |
          python - <<'PY'
          import json
          import os

          start_raw = os.environ.get('CHAPTER_START', '').strip()
          end_raw = os.environ.get('CHAPTER_END', '').strip()
          start = max(1, int(start_raw or '1'))
          end = min(8, int(end_raw or str(start)))
          if start > end:
              raise SystemExit('chapter_start must be less than or equal to chapter_end')

          chapters = json.dumps(list(range(start, end + 1)))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'chapters={chapters}\n')
          print('selected chapters:', chapters)
          PY

  render-chapter:
    needs: select-chapters
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chapter: ${{ fromJSON(needs.select-chapters.outputs.chapters) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4
        with:
          ref: spellcraft-terra-style-pipeline-v1

      - name: Install media and free local speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core fonts-freefont-ttf
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt kokoro-onnx soundfile >/dev/null

      - name: Restore Kokoro model cache
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0-model-files

      - name: Download Kokoro model and voices if missing
        run: |
          mkdir -p .kokoro
          if [ ! -s .kokoro/kokoro-v1.0.onnx ]; then
            curl -fL --retry 3 --retry-delay 2 \
              https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx \
              -o .kokoro/kokoro-v1.0.onnx
          fi
          if [ ! -s .kokoro/voices-v1.0.bin ]; then
            curl -fL --retry 3 --retry-delay 2 \
              https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin \
              -o .kokoro/voices-v1.0.bin
          fi
          test -s .kokoro/kokoro-v1.0.onnx
          test -s .kokoro/voices-v1.0.bin

      - name: Build catalog
        run: python chapter_pipeline/build_catalog.py

      - name: Compile Chapter 1 production code
        run: |
          python -m py_compile \
            chapter_pipeline/render_chapter.py \
            chapter_pipeline/cinematic_scene_renderer.py \
            chapter_pipeline/cinematic_scene_renderer_v2.py \
            chapter_pipeline/source_visual_reconstructions.py \
            chapter_pipeline/kokoro_tts.py

      - name: Restore chapter checkpoints
        uses: actions/cache@v4
        with:
          path: .chapter_cache
          key: spellcraft-c${{ matrix.chapter }}-${{ hashFiles('spellcraft_narration/**', 'chapter_pipeline/render_chapter.py', 'chapter_pipeline/cinematic_scene_renderer.py', 'chapter_pipeline/cinematic_scene_renderer_v2.py', 'chapter_pipeline/source_visual_reconstructions.py', 'chapter_pipeline/kokoro_tts.py', 'chapter_pipeline/VOICE_CONFIG.json') }}
          restore-keys: |
            spellcraft-c${{ matrix.chapter }}-

      - name: Generate locked Sarah narration and cinematic scene film
        run: |
          python chapter_pipeline/render_chapter.py \
            --chapter ${{ matrix.chapter }} \
            --catalog chapter_pipeline/catalog.json \
            --output-dir chapter_output \
            --cache-dir .chapter_cache \
            --voice-config chapter_pipeline/VOICE_CONFIG.json \
            --kokoro-model .kokoro/kokoro-v1.0.onnx \
            --kokoro-voices .kokoro/voices-v1.0.bin \
            --asset-dir chapter_pipeline/source_assets

      - name: Verify chapter artifact contract, MP4, locked voice, and visual source QA
        run: |
          chapter_mp4="chapter_output/chapter_$(printf '%03d' '${{ matrix.chapter }}').mp4"
          chapter_json="chapter_output/chapter_$(printf '%03d' '${{ matrix.chapter }}').json"
          test -s "$chapter_mp4"
          test -s "$chapter_json"
          python - "$chapter_json" "$chapter_mp4" <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          meta_path = Path(sys.argv[1])
          video_path = Path(sys.argv[2])
          meta = json.loads(meta_path.read_text(encoding='utf-8'))

          required = {
              'chapter', 'title', 'visual_version', 'scenes',
              'dynamic_object_motion_scenes', 'tentpole_motion_scenes',
              'duration_seconds', 'video', 'voice_provider', 'voice',
              'voice_locked', 'real_source_assets_used',
              'source_visual_reconstructions_used', 'pipeline'
          }
          missing = sorted(required - set(meta))
          assert not missing, f'metadata contract missing fields: {missing}'
          assert int(meta['chapter']) == int('${{ matrix.chapter }}')
          assert meta['video'] == video_path.name
          assert meta['visual_version'] == 'source_reconstruction_v3'
          assert meta['voice_provider'] == 'kokoro'
          assert meta['voice'] == 'af_sarah'
          assert meta['voice_locked'] is True
          assert int(meta['scenes']) >= 1
          assert int(meta['tentpole_motion_scenes']) >= 1
          assert int(meta['dynamic_object_motion_scenes']) >= 3
          assert float(meta['duration_seconds']) > 0
          assert 'sentence scene' in str(meta['pipeline'])

          if int(meta['chapter']) == 1:
              source_count = len(meta.get('real_source_assets_used', [])) + len(meta.get('source_visual_reconstructions_used', []))
              assert source_count >= 4, f'Chapter 1 source-visual QA failed: only {source_count} source-specific visuals'

          probe = json.loads(subprocess.check_output([
              'ffprobe', '-v', 'error', '-show_streams', '-show_format',
              '-of', 'json', str(video_path)
          ], text=True))
          streams = probe.get('streams', [])
          v = next((s for s in streams if s.get('codec_type') == 'video'), None)
          a = next((s for s in streams if s.get('codec_type') == 'audio'), None)
          assert v, 'missing video stream'
          assert a, 'missing audio stream'
          assert v.get('codec_name') == 'h264', f"unexpected video codec: {v.get('codec_name')}"
          assert int(v.get('width', 0)) == 1920 and int(v.get('height', 0)) == 1080, (
              f"unexpected frame size: {v.get('width')}x{v.get('height')}"
          )
          assert a.get('codec_name') == 'aac', f"unexpected audio codec: {a.get('codec_name')}"
          assert float(probe.get('format', {}).get('duration', 0)) > 0

          print('artifact contract verified')
          print('locked voice verified:', meta['voice'])
          print('visual version:', meta['visual_version'])
          print('cinematic scenes:', meta['scenes'])
          print('dynamic object-motion scenes:', meta['dynamic_object_motion_scenes'])
          print('source visuals:', meta['real_source_assets_used'])
          print('source reconstructions:', meta['source_visual_reconstructions_used'])
          print('media verified: 1920x1080 H.264 + AAC')
          PY

      - name: Upload completed chapter checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: spellcraft-chapter-${{ matrix.chapter }}
          path: |
            chapter_output/chapter_*.mp4
            chapter_output/chapter_*.json
          retention-days: 7

  assemble-preview:
    needs: render-chapter
    if: ${{ needs.render-chapter.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spellcraft-terra-style-pipeline-v1

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download finished chapters
        uses: actions/download-artifact@v4
        with:
          pattern: spellcraft-chapter-*
          path: chapter_output
          merge-multiple: true

      - name: Inspect downloaded chapter artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metas = sorted(Path('chapter_output').glob('chapter_*.json'))
          videos = sorted(Path('chapter_output').glob('chapter_*.mp4'))
          if not metas or not videos:
              raise SystemExit('No completed chapter artifacts were downloaded')
          for meta_path in metas:
              meta = json.loads(meta_path.read_text(encoding='utf-8'))
              video = Path('chapter_output') / str(meta.get('video', ''))
              if not video.is_file() or video.stat().st_size == 0:
                  raise SystemExit(f'Metadata {meta_path.name} references missing video {video.name}')
              print(f"chapter {meta.get('chapter')}: {video.name} / {meta.get('scenes', meta.get('chunks', 0))} scenes")
          PY

      - name: Build review player
        run: python chapter_pipeline/build_preview.py --chapters-dir chapter_output --output-dir preview_app

      - name: Assemble current master from completed chapters
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          def chapter_number(path: Path) -> int:
              try:
                  return int(path.stem.split('_')[-1])
              except Exception:
                  return 999999

          files = sorted(Path('chapter_output').glob('chapter_*.mp4'), key=chapter_number)
          if not files:
              raise SystemExit('No chapter MP4s available')

          for p in files:
              probe = json.loads(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_streams', '-of', 'json', str(p)
              ], text=True))
              streams = probe.get('streams', [])
              v = next((s for s in streams if s.get('codec_type') == 'video'), None)
              a = next((s for s in streams if s.get('codec_type') == 'audio'), None)
              if not v or not a:
                  raise SystemExit(f'{p.name}: missing video or audio stream')
              if v.get('codec_name') != 'h264' or a.get('codec_name') != 'aac':
                  raise SystemExit(f'{p.name}: incompatible codecs for concat')
              if int(v.get('width', 0)) != 1920 or int(v.get('height', 0)) != 1080:
                  raise SystemExit(f'{p.name}: incompatible frame size')

          listing = Path('chapter_output/master.concat.txt')
          listing.write_text(''.join(f"file '{p.resolve().as_posix()}'\n" for p in files), encoding='utf-8')
          subprocess.run([
              'ffmpeg', '-y', '-v', 'error', '-f', 'concat', '-safe', '0',
              '-i', str(listing), '-c', 'copy', '-movflags', '+faststart',
              'chapter_output/Spellcraft_Current_Master.mp4'
          ], check=True)
          print(f'assembled {len(files)} chapters')
          PY
          test -s chapter_output/Spellcraft_Current_Master.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 chapter_output/Spellcraft_Current_Master.mp4

      - name: Upload preview app
        uses: actions/upload-artifact@v4
        with:
          name: spellcraft-preview-app
          path: preview_app
          retention-days: 7

      - name: Upload current master
        uses: actions/upload-artifact@v4
        with:
          name: spellcraft-current-master
          path: chapter_output/Spellcraft_Current_Master.mp4
          retention-days: 7
