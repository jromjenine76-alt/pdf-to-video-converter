name: Spellcraft Chapter 1 Visual Quality Pass

on:
  push:
    branches:
      - spellcraft-visual-quality-pass-v1
    paths:
      - 'production_trigger/visual_quality.txt'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  render-visual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spellcraft-visual-quality-pass-v1

      - name: Install free local media and Sarah TTS stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core fonts-freefont-ttf
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt kokoro-onnx soundfile >/dev/null

      - name: Restore Kokoro model cache
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-v1.0-model-files

      - name: Download Kokoro model and voices if missing
        run: |
          mkdir -p .kokoro
          if [ ! -s .kokoro/kokoro-v1.0.onnx ]; then
            curl -fL --retry 3 --retry-delay 2 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o .kokoro/kokoro-v1.0.onnx
          fi
          if [ ! -s .kokoro/voices-v1.0.bin ]; then
            curl -fL --retry 3 --retry-delay 2 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o .kokoro/voices-v1.0.bin
          fi
          test -s .kokoro/kokoro-v1.0.onnx
          test -s .kokoro/voices-v1.0.bin

      - name: Build catalog
        run: python chapter_pipeline/build_catalog.py

      - name: Compile hardened converter before spending render time
        run: |
          python -m py_compile \
            chapter_pipeline/asset_ingest.py \
            chapter_pipeline/render_chapter.py \
            chapter_pipeline/render_chapter_visual_quality.py \
            chapter_pipeline/cinematic_scene_renderer_v2.py \
            chapter_pipeline/source_visual_reconstructions.py \
            chapter_pipeline/kokoro_tts.py

      - name: Render Chapter 1 with user-extracted source visuals and locked Sarah
        run: |
          python chapter_pipeline/render_chapter_visual_quality.py \
            --chapter 1 \
            --catalog chapter_pipeline/catalog.json \
            --output-dir chapter_output_visual \
            --cache-dir .chapter_cache_visual_v4 \
            --voice-config chapter_pipeline/VOICE_CONFIG.json \
            --kokoro-model .kokoro/kokoro-v1.0.onnx \
            --kokoro-voices .kokoro/voices-v1.0.bin \
            --asset-dir chapter_pipeline/source_assets

      - name: Enforce visual-quality gate
        run: |
          test -s chapter_output_visual/chapter_001.mp4
          test -s chapter_output_visual/chapter_001.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          meta = json.loads(Path('chapter_output_visual/chapter_001.json').read_text())
          assert meta['voice'] == 'af_sarah' and meta['voice_locked'] is True
          assert meta.get('visual_version') == 'user_source_visuals_v4'
          used = set(meta.get('real_source_assets_used', []))
          required_any = {
              'lo_scarabeo_tools.jpg',
              'wyspell_candle_colors.jpg',
              'wyspell_guide_pages.jpg',
              'wyspell_in_action.jpg',
              'wyspell_kit_box.jpg',
          }
          matched = sorted(used & required_any)
          assert len(matched) >= 3, f'Visual QA failed: only {matched} from the user-extracted pack were used'
          assert int(meta.get('dynamic_object_motion_scenes', 0)) >= 12, meta.get('dynamic_object_motion_scenes')
          probe = json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_streams','-of','json','chapter_output_visual/chapter_001.mp4'
          ], text=True))
          v = next(s for s in probe['streams'] if s.get('codec_type') == 'video')
          a = next(s for s in probe['streams'] if s.get('codec_type') == 'audio')
          assert v.get('codec_name') == 'h264'
          assert (int(v.get('width',0)), int(v.get('height',0))) == (1920,1080)
          assert a.get('codec_name') == 'aac'
          print('user source visuals used:', matched)
          print('rejected source visuals:', meta.get('rejected_source_assets', []))
          print('dynamic object-motion scenes:', meta.get('dynamic_object_motion_scenes'))
          print('visual quality gate passed')
          PY

      - name: Upload Chapter 1 visual-quality proof
        uses: actions/upload-artifact@v4
        with:
          name: spellcraft-chapter-1-visual-quality-v4
          path: |
            chapter_output_visual/chapter_001.mp4
            chapter_output_visual/chapter_001.json
          retention-days: 7
