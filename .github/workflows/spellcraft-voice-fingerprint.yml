name: Spellcraft Voice Fingerprint

on:
  push:
    branches: [main]
    paths:
      - 'voice_fingerprint.py'
      - '.github/workflows/spellcraft-voice-fingerprint.yml'
  workflow_dispatch:

jobs:
  generate-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenAI SDK
        run: pip install openai==3.6.0

      - name: Generate voice candidates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY missing" && exit 2)
          python voice_fingerprint.py

      - name: Upload voice candidates
        uses: actions/upload-artifact@v4
        with:
          name: spellcraft-voice-candidates
          path: voice_candidates/
          retention-days: 1
